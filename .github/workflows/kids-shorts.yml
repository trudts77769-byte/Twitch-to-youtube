name: Kids Brain-Teaser Shorts

on:
  schedule:
    # Every day at 17:00 UTC (1pm ET / 10am PT) — after-school viewing window
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      puzzle_id:
        description: "Specific puzzle id to render (leave blank for next-in-queue)"
        required: false
        default: ""
      privacy:
        description: "Privacy override"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  post-short:
    if: vars.AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate & upload next Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || vars.YOUTUBE_PRIVACY || 'public' }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_SHORTS_PLAYLIST_ID }}
          MADE_FOR_KIDS: "true"
          PUZZLE_ID: ${{ github.event.inputs.puzzle_id }}
        run: python scripts/post_shorts.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/uploaded_shorts.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: record uploaded kids short [skip ci]"
            git push
          fi
